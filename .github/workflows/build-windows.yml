# =============================================================================
#  Guyma Cyb — Build Windows .exe (GitHub Actions)
#  --------------------------------------------------------------------------
#  Construit automatiquement GuymaCyb-Setup-v1.0.0.exe sur Windows à chaque
#  push sur main, sur un tag v*, ou via déclenchement manuel.
#
#  L'installateur final est uploadé comme artifact téléchargeable.
#  Sur les tags v*, une release GitHub est aussi créée avec le .exe attaché.
# =============================================================================
name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write            # pour créer les releases GitHub sur les tags

jobs:
  build-windows:
    name: Build GuymaCyb-Setup.exe (Windows x64)
    runs-on: windows-latest

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # 2. Node.js + Bun
      # ----------------------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Pas de cache npm : on n'a pas de package-lock.json (le projet utilise bun.lock)
          # et le cache npm échouerait avec "Dependencies lock file is not found".

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ----------------------------------------------------------------------
      # 3. Rust (noyau shadowscan-core, target windows-gnu)
      # ----------------------------------------------------------------------
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 💾 Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shadowscan-core

      - name: 🔨 Build Rust core (shadowscan-core.exe)
        shell: bash
        run: |
          cd shadowscan-core
          cargo build --release --target x86_64-pc-windows-gnu
          ls -la target/x86_64-pc-windows-gnu/release/shadowscan-core.exe

      # ----------------------------------------------------------------------
      # 4. Install JS dependencies
      # ----------------------------------------------------------------------
      - name: 📦 Install dependencies
        # On génère d'abord un package-lock.json via npm (requis par electron-builder
        # et setup-node cache). Bun install peut échouer en CI Windows sur certaines
        # deps natives ; npm install est plus fiable.
        run: |
          bun install || npm install --no-audit --no-fund
          # Générer un lockfile npm pour electron-builder si absent
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --no-audit --no-fund || true; fi
        shell: bash

      # ----------------------------------------------------------------------
      # 5. Build frontend (Vite → dist/)
      # ----------------------------------------------------------------------
      - name: 🎨 Build frontend
        run: bun run build || npx vite build
        env:
          NODE_ENV: production

      # ----------------------------------------------------------------------
      # 6. Bundle Express backend (esbuild → dist-server/server.cjs)
      # ----------------------------------------------------------------------
      - name: 🧵 Bundle backend
        run: node desktop/build-server-bundle.js

      - name: ✅ Verify backend bundle
        shell: bash
        run: |
          ls -la dist-server/
          test -f dist-server/server.cjs && echo "server.cjs OK"
          test -f dist-server/sql-wasm.wasm && echo "sql-wasm.wasm OK"

      # ----------------------------------------------------------------------
      # 7. Stage Rust exe + security scripts pour electron-builder
      #    electron-builder.yml référence ces chemins dans extraResources.
      # ----------------------------------------------------------------------
      - name: 📂 Stage extra resources
        shell: bash
        run: |
          mkdir -p staging
          cp shadowscan-core/target/x86_64-pc-windows-gnu/release/shadowscan-core.exe staging/
          cp -r security-scripts staging/
          echo "Staged files:"
          ls -la staging/

      # ----------------------------------------------------------------------
      # 8. Package + signature .exe (electron-builder)
      #    Le certificat .pfx est décodé en bash si le secret WIN_CERT_PFX
      #    est défini (on ne peut PAS utiliser `secrets` dans un `if:` —
      #    GitHub Actions le refuse. On passe donc par env + check bash).
      # ----------------------------------------------------------------------
      - name: 🪟 Build + sign .exe installer (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -e
          # Décode le certificat si le secret est défini (check bash, pas `if: secrets`)
          if [ -n "$WIN_CERT_PFX" ]; then
            mkdir -p desktop/signing
            printf '%s' "$WIN_CERT_PFX" | base64 -d > desktop/signing/ci-cert.pfx
            export CSC_LINK="$(pwd)/desktop/signing/ci-cert.pfx"
            export CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
            echo "✓ Signature Authenticode activée ($(wc -c < desktop/signing/ci-cert.pfx) bytes)"
          else
            echo "ℹ Pas de secret WIN_CERT_PFX — .exe non signé"
          fi
          # Build NSIS installer (electron-builder signe auto si CSC_LINK est exporté)
          npx electron-builder --win nsis --x64

      # ----------------------------------------------------------------------
      # 9. Vérifier l'installateur final
      # ----------------------------------------------------------------------
      - name: ✅ Verify installer
        shell: bash
        run: |
          ls -la dist_electron/
          EXE=$(find dist_electron -name "*.exe" -type f | head -1)
          if [ -z "$EXE" ]; then
            echo "❌ Aucun .exe trouvé dans dist_electron/"
            exit 1
          fi
          echo "✅ Installateur généré: $EXE"
          ls -lh "$EXE"

      # ----------------------------------------------------------------------
      # 10. Upload artifact (téléchargeable depuis l'onglet Actions)
      # ----------------------------------------------------------------------
      - name: 📤 Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: GuymaCyb-Setup-windows-x64
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 90

      # ----------------------------------------------------------------------
      # 11. Créer une release GitHub si on est sur un tag v*
      # ----------------------------------------------------------------------
      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          name: Guyma Cyb ${{ github.ref_name }}
          body: |
            ## Guyma Cyb ${{ github.ref_name }}

            ### 📥 Téléchargement
            - **GuymaCyb-Setup-${{ github.ref_name }}.exe** — Installateur Windows 10/11 (x64)

            ### ⚙️ Installation
            1. Téléchargez `GuymaCyb-Setup-*.exe`
            2. Double-cliquez pour lancer l'installation (NSIS wizard)
            3. Au premier lancement, l'**assistant de configuration** démarre :
               - détection + installation de WSL (Windows Subsystem for Linux)
               - installation des outils Linux (nmap, aircrack-ng, hashcat, searchsploit…)
               - vérification du noyau (Rust ou fallback Node)
            4. L'application principale s'ouvre — prête à l'emploi

            ### 🎯 Architecture
            - Logiciel Windows **natif** (Electron) qui exécute de **vrais outils Linux** via WSL
            - Inspiré de StrykerOSS (Android + chroot/QEMU) adapté à Windows (WSL)
            - **Aucune simulation** : outils réels, messages honnêtes si hardware absent
            - Scans de base (HTTP, ports, DNS, TLS, réseau local) fonctionnent SANS WSL via Node

            ### ✅ Modules (18)
            - Dashboard, Scanner & Recon, Analyse Web, Réseau Local (mDNS/SSDP/NetBIOS)
            - Tests Actifs, Lab Attaques Web, Résultats & Preuves
            - WiFi & Réseau, Handshakes, Lab Attaques WiFi
            - Arsenal (searchsploit/hashcat), GeoMac, MAC Changer, Terminal (bash/PS/CMD/Python)
            - Cours & Notions, Rapport & Remédiation, Core Manager (WSL)

            ### 📋 Prérequis pour fonctionnalités avancées
            - **WSL** (le wizard l'installe en 1 clic — `wsl --install`)
            - **Clé WiFi USB mode monitor** (AR9271/88XXAU) pour le scan WiFi réel
            - **WIGLE_API_KEY** (env) pour la géolocalisation MAC réelle

            ### 🔐 Signature
            Le .exe est signé Authenticode si le secret `WIN_CERT_PFX` est configuré.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
